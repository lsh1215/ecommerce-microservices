name: PR Title Check

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: read

jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional commit title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            style
            perf
            build
            revert
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: |
            The subject (after the prefix) must not be empty.
            Example: "feat: add user authentication"
