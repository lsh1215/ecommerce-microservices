name: Infra CI

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'monitoring/**'
      - '.github/workflows/ci-infra.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate infra/docker-compose.yml
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate monitoring/docker-compose.pinpoint.yml
        run: docker compose -f monitoring/docker-compose.pinpoint.yml config --quiet
