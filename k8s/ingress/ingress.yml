# Public routes — no auth required. Customer create/login + product browse.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-public-ingress
  namespace: ecommerce
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: service-product
                port:
                  number: 8081
          - path: /api/brands
            pathType: Prefix
            backend:
              service:
                name: service-product
                port:
                  number: 8081
          - path: /api/customers
            pathType: Prefix
            backend:
              service:
                name: service-customer
                port:
                  number: 8084
---
# Protected routes — JWT verified at the ingress via Traefik forwardAuth.
# The middleware adds X-Customer-Id from the verified token onto every
# request reaching service-order / service-payment, removing the need for
# either to call service-customer for identity validation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-protected-ingress
  namespace: ecommerce
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ecommerce-jwt-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: service-order
                port:
                  number: 8082
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: service-payment
                port:
                  number: 8083
---
# Grafana served at /grafana (sub-path). GF_SERVER_SERVE_FROM_SUB_PATH=true
# means Grafana itself rewrites asset URLs; Traefik forwards the path
# unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# Jaeger UI served at /jaeger (QUERY_BASE_PATH=/jaeger inside the all-in-one
# image rewrites asset URLs to match).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /jaeger
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686
