apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: service-product
                port:
                  number: 8081
          - path: /api/brands
            pathType: Prefix
            backend:
              service:
                name: service-product
                port:
                  number: 8081
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: service-order
                port:
                  number: 8082
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: service-payment
                port:
                  number: 8083
          - path: /api/customers
            pathType: Prefix
            backend:
              service:
                name: service-customer
                port:
                  number: 8084
---
# Grafana served at /grafana (sub-path). GF_SERVER_SERVE_FROM_SUB_PATH=true
# means Grafana itself rewrites asset URLs; Traefik forwards the path
# unchanged.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
