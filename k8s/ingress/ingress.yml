apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: service-product
                port:
                  number: 8081
          - path: /api/brands
            pathType: Prefix
            backend:
              service:
                name: service-product
                port:
                  number: 8081
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: service-order
                port:
                  number: 8082
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: service-payment
                port:
                  number: 8083
          - path: /api/customers
            pathType: Prefix
            backend:
              service:
                name: service-customer
                port:
                  number: 8084
