apiVersion: v1
kind: Service
metadata:
  name: service-order
  namespace: ecommerce
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: service-order
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-order
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
      labels:
        app: service-order
    spec:
      nodeSelector:
        role: svc-order
      containers:
        - name: service-order
          image: ecommerce/service-order:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
            - configMapRef:
                name: otel-config
                optional: true
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-order-service:3306/ecommerce_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
            - name: SERVER_PORT
              value: "8082"
            - name: DB_NAME
              value: "ecommerce_order"
            - name: PRODUCT_SERVICE_URL
              value: "http://service-product:8081"
            - name: OTEL_SERVICE_NAME
              value: "service-order"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=ecommerce,deployment.environment=gce,k8s.cluster.name=ecommerce-k3s"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 20
