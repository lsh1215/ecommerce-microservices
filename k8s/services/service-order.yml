apiVersion: v1
kind: Service
metadata:
  name: service-order
  namespace: ecommerce
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: service-order
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: service-order
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
      labels:
        app: service-order
    spec:
      nodeSelector:
        role: svc-order
      containers:
        - name: service-order
          # Placeholder. The real image is injected at deploy time by the
          # kustomize images transformer (k8s/services/kustomization.yml is the
          # base; scripts/loadtest/deploy-phase.sh supplies newName/newTag).
          # No registry, project id, or tag belongs in this file.
          image: ecommerce/service-order:UNSET
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
            - configMapRef:
                name: otel-config
                optional: true
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: DB_NAME
              value: "ecommerce_order"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-order-service:3306/ecommerce_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
            - name: PRODUCT_SERVICE_URL
              value: "http://service-product:8081"
            - name: OTEL_SERVICE_NAME
              value: "service-order"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=ecommerce,deployment.environment=gce,k8s.cluster.name=ecommerce-k3s"
            # Inject traceId / spanId into every log line so Loki can join
            # log lines to Tempo traces and cross-service queries can pivot
            # on a single business identifier.
            - name: LOGGING_PATTERN_CONSOLE
              value: "%d{ISO8601} %-5level [%thread] [traceId=%X{trace_id:-},spanId=%X{span_id:-}] %logger{36} - %msg%n"
          resources:
            requests:
              memory: "768Mi"
              cpu: "600m"
            limits:
              memory: "1536Mi"
              cpu: "1500m"
          # 90 × 5s = 7.5 min budget. OTel javaagent's first OTLP export to
          # Alloy can stall for ~1-2 min on cold start; default 30 fails when
          # a chaos cycle happens to coincide with Alloy restart.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 20
