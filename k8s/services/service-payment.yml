apiVersion: v1
kind: Service
metadata:
  name: service-payment
  namespace: ecommerce
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: service-payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-payment
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/actuator/prometheus"
      labels:
        app: service-payment
    spec:
      containers:
        - name: service-payment
          image: ecommerce/service-payment:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: ecommerce-config
            - secretRef:
                name: ecommerce-secrets
            - configMapRef:
                name: otel-config
                optional: true
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: DB_NAME
              value: "ecommerce_payment"
            - name: OTEL_SERVICE_NAME
              value: "service-payment"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=ecommerce,deployment.environment=gce,k8s.cluster.name=ecommerce-k3s"
            # Inject traceId / spanId into every log line so Loki can join
            # log lines to Tempo traces and cross-service queries can pivot
            # on a single business identifier.
            - name: LOGGING_PATTERN_CONSOLE
              value: "%d{ISO8601} %-5level [%thread] [traceId=%X{trace_id:-},spanId=%X{span_id:-}] %logger{36} - %msg%n"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # 90 × 5s = 7.5 min budget. OTel javaagent's first OTLP export to
          # Alloy can stall for ~1-2 min on cold start; default 30 fails when
          # a chaos cycle happens to coincide with Alloy restart.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
