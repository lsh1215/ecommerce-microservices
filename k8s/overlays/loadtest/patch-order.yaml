apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order
spec:
  # 접수는 무상태 → 수평 확장. 1000rps 클린 접수(p95 4ms)는 2파드에서 확인.
  replicas: 2
  template:
    spec:
      containers:
        - name: service-order
          # R2에서 order가 CPU 스로틀 11~88%를 먹었다(product는 0.08%로 멀쩡).
          # 진입점이 JSON 파싱 + JPA + Kafka 발행 + product REST 호출을 모두 하므로
          # 2 vCPU로는 부족했다. 스로틀 knee 위로 올린다.
          resources:
            requests:
              cpu: "2000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          env:
            # 컨테이너 메모리의 1/4(기본)이면 2Gi에서 힙 512Mi에 그쳐 GC가 측정을 오염시킨다.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
            # 독립 row INSERT 워크로드: 풀을 넉넉히 둬 group-commit 동시성 확보.
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "32"
