apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-payment
spec:
  template:
    spec:
      containers:
        - name: service-payment
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
