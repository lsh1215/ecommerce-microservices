apiVersion: v1
kind: Service
metadata:
  name: pinpoint-collector
  namespace: monitoring
  labels:
    app: pinpoint-collector
spec:
  selector:
    app: pinpoint-collector
  ports:
    - name: agent-tcp
      port: 9994
      targetPort: 9994
      protocol: TCP
    - name: stat-grpc
      port: 9991
      targetPort: 9991
      protocol: TCP
    - name: span-grpc
      port: 9993
      targetPort: 9993
      protocol: TCP
    - name: agent-grpc
      port: 9992
      targetPort: 9992
      protocol: TCP
    - name: stat-udp
      port: 9995
      targetPort: 9995
      protocol: UDP
    - name: span-udp
      port: 9996
      targetPort: 9996
      protocol: UDP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-collector
  template:
    metadata:
      labels:
        app: pinpoint-collector
    spec:
      containers:
        - name: collector
          image: pinpointdocker/pinpoint-collector:3.0.5
          ports:
            - containerPort: 9991
            - containerPort: 9992
            - containerPort: 9993
            - containerPort: 9994
            - containerPort: 9995
              protocol: UDP
            - containerPort: 9996
              protocol: UDP
          env:
            # Spring relaxed binding: PINPOINT_ZOOKEEPER_ADDRESS -> pinpoint.zookeeper.address
            - name: PINPOINT_ZOOKEEPER_ADDRESS
              value: "pinpoint-hbase.monitoring.svc.cluster.local"
            - name: HBASE_HOST
              value: "pinpoint-hbase.monitoring.svc.cluster.local"
            - name: HBASE_PORT
              value: "2181"
          resources:
            requests:
              memory: "384Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9991
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 9991
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
