apiVersion: v1
kind: Service
metadata:
  name: pinpoint-web
  namespace: monitoring
  labels:
    app: pinpoint-web
spec:
  selector:
    app: pinpoint-web
  ports:
    - port: 8079
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinpoint-web
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pinpoint-web
  template:
    metadata:
      labels:
        app: pinpoint-web
    spec:
      containers:
        - name: web
          image: pinpointdocker/pinpoint-web:3.0.5
          ports:
            - containerPort: 8080
          env:
            - name: PINPOINT_ZOOKEEPER_ADDRESS
              value: "pinpoint-hbase.monitoring.svc.cluster.local"
            - name: HBASE_HOST
              value: "pinpoint-hbase.monitoring.svc.cluster.local"
            - name: HBASE_PORT
              value: "2181"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
