# Kafka UI — used to capture topic / consumer-group state during evidence
# collection (especially for the outbox + SAGA units, where the visualization
# of topics, partitions, lag and message contents is the most direct evidence
# of the failure mode).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: monitoring
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: ecommerce
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka-service.ecommerce.svc.cluster.local:9092
            - name: DYNAMIC_CONFIG_ENABLED
              value: "true"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /kafka-ui
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /kafka-ui/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: monitoring
spec:
  selector:
    app: kafka-ui
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Sub-path /kafka-ui — same pattern as Grafana (ingress forwards path
# unchanged, app self-rewrites assets via SERVER_SERVLET_CONTEXT_PATH).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-ingress
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /kafka-ui
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080
