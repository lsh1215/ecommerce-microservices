apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: ecommerce-k3s

    # Accept out-of-order samples within a 10-minute window. The 7 alloy
    # DaemonSet pods all remote_write the same kube-state / cadvisor /
    # etcd / apiserver series, and their per-pod scrape phases drift by
    # seconds — without this the strict-monotonic check rejects every
    # late arrival, which costs CPU + memory on the rejection path.
    # No effect on query correctness; OOO chunks are merged on read.
    storage:
      tsdb:
        out_of_order_time_window: 10m

    scrape_configs:
      - job_name: prometheus
        static_configs: [{ targets: ['localhost:9090'] }]

      # Alloy aggregates and forwards most metrics via remote_write,
      # but we also scrape its internal http endpoint for self-monitoring.
      - job_name: alloy
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [monitoring] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: alloy
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:12345

      # Per-database mysqld-exporter scrape — discovers the four
      # mysqld-exporter Services in the ecommerce namespace and lifts the
      # `db` Service label onto every metric so dashboards can split by
      # database. Existing ClusterRole at lines 133-145 already grants
      # services + endpoints get/list/watch.
      # 컨테이너 CPU/스로틀. alloy 는 노드마다 하나씩 도는데 각 인스턴스가 모든 노드를
      # 긁어 같은 시리즈를 여러 곳에서 써넣었고, 프로메테우스가 순서 어긋난 샘플을 버려
      # 구멍이 났다. 단일 인스턴스인 프로메테우스가 직접 긁으면 기록자가 하나뿐이다.
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
      - job_name: mysqld-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [ecommerce] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: mysqld-exporter
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_service_label_db]
            target_label: db
          - source_labels: [__meta_kubernetes_service_label_app]
            target_label: app
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 3Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      nodeSelector:
        role: monitoring
      serviceAccountName: prometheus
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus/data
            - --storage.tsdb.retention.time=3d
            - --storage.tsdb.retention.size=2GB
            - --web.enable-remote-write-receiver
            - --web.listen-address=:9090
            - --web.enable-lifecycle
            # delete_series / clean_tombstones. A load script that tags series
            # per-URL can inject millions of series into the head, and without
            # this the only remedy is wiping the whole TSDB. Evidence cluster
            # only — this API is unauthenticated.
            - --web.enable-admin-api
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            # Prometheus head-block memory grows with active series count.
            # The 2026-08-11 rebaseline campaign proved 2Gi is not enough:
            # k6 remote_write adds ~36k short-lived series per run and 43 runs
            # accumulated past the ceiling, so Prometheus sat in OOMKill
            # (exit 137) through most of the campaign. The TSDB survived on
            # the PVC but nothing was scraped while the process was down, and
            # 10 of 43 measure windows ended up with zero metrics — no
            # dashboard evidence could be produced for them afterwards.
            # 6Gi is ~2.5x the observed post-campaign working set and still
            # leaves headroom on the 16 GiB e2-highmem-2 monitoring node for
            # coresident grafana/loki/tempo.
            requests: { cpu: 200m,  memory: 2Gi }
            limits:   { cpu: 1500m, memory: 6Gi }
          # Prometheus replays the WAL + head block on every cold start;
          # with a 3d retention / 2GB TSDB this regularly takes 60–180 s
          # and the process is CPU-bound (single-digit second responses
          # but no `/-/healthy` 200 yet). The previous setup (no startupProbe,
          # liveness initialDelaySeconds=60) killed the pod mid-replay
          # with reason=Completed exit=0 — kubelet's liveness fail looked
          # like a clean shutdown in the logs ("See you next time!"),
          # masking the real cause as something else. startupProbe is
          # the correct primitive: liveness/readiness only start once
          # startup says the process is up.
          startupProbe:
            httpGet: { path: /-/ready, port: 9090 }
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
# NodePort for k6 remote_write from laptop. Restrict with GCE firewall (allow from
# owner IP /32 only — see docs/observability/runbook.md).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-remote-write
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
