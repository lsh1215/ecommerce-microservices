            {
              "expr": "sum(rate(mysql_global_status_queries{db=\"product\"}[1m]))",
              "legendFormat": "쿼리/s",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
