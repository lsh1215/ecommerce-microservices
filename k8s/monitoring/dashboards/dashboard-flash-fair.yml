        {
          "id": 1,
          "title": "처리량 (rps)",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(k6_flash_202_total[30s]))",
              "legendFormat": "접수",
              "refId": "A"
            },
            {
              "expr": "sum(rate(k6_flash_409_total[30s]))",
              "legendFormat": "매진 거절",
              "refId": "B"
            },
            {
              "expr": "sum(rate(k6_flash_5xx_total[30s]))",
              "legendFormat": "5xx",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 20,
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
