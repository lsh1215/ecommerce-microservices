              "expr": "100*sum(rate(container_cpu_cfs_throttled_periods_total{pod=~\"service-order-.*\"}[1m]))/clamp_min(sum(rate(container_cpu_cfs_periods_total{pod=~\"service-order-.*\"}[1m])),0.001)",
