apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-flash-fair
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  flash-fair.json: |
    {
      "uid": "flash-fair",
      "title": "Flash Sale",
      "tags": [
        "ecommerce",
        "flash"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "refresh": "",
      "panels": [
        {
          "id": 10,
          "title": "접수 (202)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "expr": "sum(k6_flash_202_total)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "textMode": "auto",
            "graphMode": "none"
          }
        },
        {
          "id": 11,
          "title": "매진 거절 (409)",
