apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ecommerce-ev-before-after
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ecommerce-ev-before-after.json: |
    {
      "uid": "ecommerce-ev-ba",
      "title": "Ecommerce EV Before/After",
      "tags": ["ecommerce", "evidence"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-10m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "custom",
            "current": { "text": "service-order", "value": "service-order" },
            "query": "service-order,service-product,service-payment,service-customer",
            "options": [
              { "text": "service-order", "value": "service-order", "selected": true },
              { "text": "service-product", "value": "service-product", "selected": false },
              { "text": "service-payment", "value": "service-payment", "selected": false },
              { "text": "service-customer", "value": "service-customer", "selected": false }
            ]
          },
          {
            "name": "rw",
            "label": "rate-window",
            "type": "custom",
            "current": { "text": "2m", "value": "2m" },
            "query": "1m,2m,3m",
            "options": [
              { "text": "1m", "value": "1m", "selected": false },
              { "text": "2m", "value": "2m", "selected": true },
              { "text": "3m", "value": "3m", "selected": false }
            ]
          }
        ]
      },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "RPS — req/s",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "none", "decimals": 1,
            "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] }, "justifyMode": "auto" },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(rate(http_server_requests_seconds_count{app=\"$service\", uri!~\"/actuator.*\"}[$rw])) or vector(0)" } ]
        },
        {
          "id": 2, "type": "stat", "title": "5xx rate",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "decimals": 3,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "red", "value": 0.5 } ] },
            "color": { "mode": "thresholds" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "100 * ((sum(rate(http_server_requests_seconds_count{app=\"$service\", uri!~\"/actuator.*\", status=~\"5..\"}[$rw])) or vector(0)) / clamp_min(sum(rate(http_server_requests_seconds_count{app=\"$service\", uri!~\"/actuator.*\"}[$rw])), 0.001))" } ]
        },
        {
          "id": 3, "type": "stat", "title": "avg server latency",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3,
            "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(rate(http_server_requests_seconds_sum{app=\"$service\", uri!~\"/actuator.*\"}[$rw])) / clamp_min(sum(rate(http_server_requests_seconds_count{app=\"$service\", uri!~\"/actuator.*\"}[$rw])), 0.001)" } ]
        },
        {
          "id": 4, "type": "stat", "title": "app container CPU (cores)",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 2,
            "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value",
            "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"ecommerce\", pod=~\"$service-.*\", container!=\"\", container!=\"POD\"}[$rw]))" } ]
        },
        {
          "id": 5, "type": "stat", "title": "Max HTTP latency",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 3,
            "color": { "mode": "fixed", "fixedColor": "green" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value",
            "reduceOptions": { "calcs": ["max"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(http_server_requests_seconds_max{app=\"$service\", uri!~\"/actuator.*\"})" } ]
        },
        {
          "id": 6, "type": "stat", "title": "Hikari pending",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short", "decimals": 0,
            "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }, { "color": "red", "value": 1 } ] },
            "color": { "mode": "thresholds" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "textMode": "value",
            "reduceOptions": { "calcs": ["max"] } },
          "targets": [ { "refId": "A", "datasource": { "type": "prometheus", "uid": "prometheus" },
            "expr": "max(hikaricp_connections_pending{app=\"$service\"})" } ]
        }
      ]
    }
