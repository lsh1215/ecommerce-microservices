apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ecommerce-ev-lock
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ecommerce-ev-lock.json: |
    {
      "uid": "ecommerce-ev-lock",
      "title": "Ecommerce EV InnoDB Row-Lock",
      "tags": ["ecommerce", "evidence"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-15m", "to": "now" },
      "templating": { "list": [
        { "name": "db", "type": "custom", "current": {"text":"product","value":"product"},
          "query": "product,order,payment,customer", "options": [
            {"text":"product","value":"product","selected":true},
            {"text":"order","value":"order"},
            {"text":"payment","value":"payment"},
            {"text":"customer","value":"customer"} ] }
      ] },
      "panels": [
        { "id":1, "type":"timeseries", "title":"InnoDB 행 락 평균 대기 시간 (product DB)",
          "gridPos":{"x":0,"y":0,"w":12,"h":9},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"unit":"ms","custom":{"drawStyle":"line","fillOpacity":20,"lineWidth":3,"lineInterpolation":"smooth"},"color":{"mode":"fixed","fixedColor":"orange"}},"overrides":[]},
          "options":{"legend":{"displayMode":"list","placement":"bottom"},"tooltip":{"mode":"single"}},
          "targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},
            "expr":"rate(mysql_global_status_innodb_row_lock_time{db=\"$db\"}[30s]) / clamp_min(rate(mysql_global_status_innodb_row_lock_waits{db=\"$db\"}[30s]),1)","legendFormat":"avg row-lock wait (ms)"}] },
        { "id":2, "type":"timeseries", "title":"동시 락 대기 트랜잭션 수 (current row-lock waiters)",
          "gridPos":{"x":12,"y":0,"w":12,"h":9},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"unit":"short","custom":{"drawStyle":"line","fillOpacity":20,"lineWidth":3,"lineInterpolation":"smooth"},"color":{"mode":"fixed","fixedColor":"red"}},"overrides":[]},
          "options":{"legend":{"displayMode":"list","placement":"bottom"},"tooltip":{"mode":"single"}},
          "targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},
            "expr":"mysql_global_status_innodb_row_lock_current_waits{db=\"$db\"}","legendFormat":"current waiters"}] },
        { "id":3, "type":"timeseries", "title":"실행 중 스레드 수 (threads_running)",
          "gridPos":{"x":0,"y":9,"w":12,"h":9},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"unit":"short","custom":{"drawStyle":"line","fillOpacity":20,"lineWidth":3,"lineInterpolation":"smooth"},"color":{"mode":"fixed","fixedColor":"blue"}},"overrides":[]},
          "options":{"legend":{"displayMode":"list","placement":"bottom"},"tooltip":{"mode":"single"}},
          "targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},
            "expr":"mysql_global_status_threads_running{db=\"$db\"}","legendFormat":"threads_running"}] },
        { "id":4, "type":"timeseries", "title":"MySQL 컨테이너 CPU (코어)",
          "gridPos":{"x":12,"y":9,"w":12,"h":9},
          "datasource":{"type":"prometheus","uid":"prometheus"},
          "fieldConfig":{"defaults":{"unit":"short","decimals":2,"custom":{"drawStyle":"line","fillOpacity":20,"lineWidth":3,"lineInterpolation":"smooth"},"color":{"mode":"fixed","fixedColor":"purple"}},"overrides":[]},
          "options":{"legend":{"displayMode":"list","placement":"bottom"},"tooltip":{"mode":"single"}},
          "targets":[{"refId":"A","datasource":{"type":"prometheus","uid":"prometheus"},
            "expr":"sum(rate(container_cpu_usage_seconds_total{namespace=\"ecommerce\", pod=~\"mysql-$db-.*\", container!=\"\", container!=\"POD\"}[2m]))","legendFormat":"mysql-$db CPU"}] }
      ]
    }
