apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ev-catalog-reserve
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  ecommerce-ev-catalog-reserve.json: "{\n  \"uid\": \"ecommerce-ev-catalog-reserve\",\n  \"title\": \"Ecommerce EV Catalog+Reserve (mixed load)\",\n  \"tags\": [\n    \"evidence\"\n  ],\n  \"timezone\": \"Asia/Seoul\",\n  \"schemaVersion\": 39,\n  \"refresh\": \"\",\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n  \"panels\": [\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"① 예약 지연 (k6 클라이언트 관측)\",\n      \"description\": \"이 실험의 주 지표. 서버 내부 span이 아니라 클라이언트가 실제로 겪은 시간이라 커넥션 대기가 포함된다. k6 remote-write는 초 단위로 내보낸다.\",\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\"\n          },\n          \"max\": 5\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"max(k6_reserve_ms_p95{arm=~\\\"$arm\\\"})\",\n          \"legendFormat\": \"예약 p95\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"max(k6_reserve_ms_p99{arm=~\\\"$arm\\\"})\",\n          \"legendFormat\": \"예약 p99\",\n          \"refId\": \"B\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"② 조회 지연 — 엔드포인트별 (k6 클라이언트 관측)\",\n      \"description\": \"예약과 같은 DB를 두고 경합하는 쪽. 캐시가 흡수하면 여기가 먼저 내려간다.\",\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\"\n          },\n          \"max\": 5\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"max(k6_http_req_duration_p95{arm=~\\\"$arm\\\",name=\\\"GET /api/products\\\"})\",\n          \"legendFormat\": \"목록 p95 (캐시 대상)\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"max(k6_http_req_duration_p95{arm=~\\\"$arm\\\",name=\\\"GET /api/products/:id\\\"})\",\n          \"legendFormat\": \"상세 p95\",\n          \"refId\": \"B\"\n        },\n        {\n          \"expr\": \"max(k6_http_req_duration_p95{arm=~\\\"$arm\\\",name=\\\"GET /api/internal/products/variants/:id\\\"})\",\n          \"legendFormat\": \"재고 p95\",\n          \"refId\": \"C\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"③ 조회 캐시 히트율 — 캐시가 실제로 흡수한 비율\",\n      \"description\": \"이 실험의 메커니즘. 캐시가 DB에서 덜어낸 조회의 비율이고, 여기가 올라간 만큼 ④ MySQL CPU가 내려간다. 기존 arm은 캐시 자체가 없어 시리즈가 없다.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 9\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"min\": 0,\n          \"max\": 100,\n          \"custom\": {\n            \"fillOpacity\": 15,\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 40\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 65\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\": \"right\",\n          \"calcs\": [\n            \"mean\",\n            \"last\"\n          ]\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"100 * sum by (cache) (rate(cache_gets_total{app=\\\"service-product\\\",result=\\\"hit\\\"}[1m])) / clamp_min(sum by (cache) (rate(cache_gets_total{app=\\\"service-product\\\"}[1m])), 0.001)\",\n          \"legendFormat\": \"{{cache}}\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"100 * sum(rate(cache_gets_total{app=\\\"service-product\\\",result=\\\"hit\\\"}[1m])) / clamp_min(sum(rate(cache_gets_total{app=\\\"service-product\\\"}[1m])), 0.001)\",\n          \"legendFormat\": \"전체\",\n          \"refId\": \"B\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"④ MySQL CPU (코어) — DB에 남은 여유\",\n      \"description\": \"캐시가 조회를 흡수하면 여기에 여유가 생기고, 그 여유가 예약 지연을 결정한다. limit 2코어.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 0,\n        \"y\": 17\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"max\": 2,\n          \"custom\": {\n            \"fillOpacity\": 20,\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\"\n          },\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 1.6\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 1.9\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(container_cpu_usage_seconds_total{namespace=\\\"ecommerce\\\", pod=~\\\"mysql-product-0\\\", container!=\\\"\\\", container!=\\\"POD\\\"}[1m]))\",\n          \"legendFormat\": \"mysql-product CPU / 2.0\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"⑤ 커넥션 풀 — 활성 vs 대기\",\n      \"description\": \"총 15. 활성이 15에 붙고 대기가 쌓이면 요청은 서버에 들어가기도 전에 줄을 서고 있다.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 8,\n        \"y\": 17\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"none\",\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": [\n          {\n            \"matcher\": {\n              \"id\": \"byName\",\n              \"options\": \"대기(pending)\"\n            },\n            \"properties\": [\n              {\n                \"id\": \"color\",\n                \"value\": {\n                  \"mode\": \"fixed\",\n                  \"fixedColor\": \"red\"\n                }\n              }\n            ]\n          }\n        ]\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(hikaricp_connections_active{app=\\\"service-product\\\"})\",\n          \"legendFormat\": \"활성(active) / 15\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"sum(hikaricp_connections_pending{app=\\\"service-product\\\"})\",\n          \"legendFormat\": \"대기(pending)\",\n          \"refId\": \"B\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"⑥ 부하 타당성 — 처리량과 실패\",\n      \"description\": \"오퍼를 실제로 소화했는지, 5xx나 재고 소진(409)이 결과를 오염시키지 않았는지.\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 8,\n        \"x\": 16,\n        \"y\": 17\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"fillOpacity\": 0,\n            \"lineWidth\": 2,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        }\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(k6_reserve_2xx_total{arm=~\\\"$arm\\\"}[1m]))\",\n          \"legendFormat\": \"예약 성공/s\",\n          \"refId\": \"A\"\n        },\n        {\n          \"expr\": \"sum(rate(k6_browse_2xx_total{arm=~\\\"$arm\\\"}[1m]))\",\n          \"legendFormat\": \"조회 성공/s\",\n          \"refId\": \"B\"\n        },\n        {\n          \"expr\": \"sum(rate(k6_reserve_5xx_total{arm=~\\\"$arm\\\"}[1m])) + sum(rate(k6_reserve_conflict_total{arm=~\\\"$arm\\\"}[1m]))\",\n          \"legendFormat\": \"예약 5xx+409/s\",\n          \"refId\": \"C\"\n        }\n      ]\n    }\n  ],\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"arm\",\n        \"label\": \"arm\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"prometheus\"\n        },\n        \"query\": {\n          \"query\": \"label_values(k6_http_reqs_total, arm)\",\n          \"refId\": \"A\"\n        },\n        \"refresh\": 1,\n        \"includeAll\": false,\n        \"multi\": false,\n        \"current\": {}\n      }\n    ]\n  }\n}"
