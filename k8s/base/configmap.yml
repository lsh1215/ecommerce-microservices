apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  SPRING_PROFILES_ACTIVE: "k8s"
  CORS_ALLOWED_ORIGINS: "http://localhost:3000"
  # 3-broker Kafka StatefulSet: bootstrap via per-pod headless DNS
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-service.ecommerce.svc.cluster.local:9092,kafka-1.kafka-service.ecommerce.svc.cluster.local:9092,kafka-2.kafka-service.ecommerce.svc.cluster.local:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-service.ecommerce.svc.cluster.local:9092,kafka-1.kafka-service.ecommerce.svc.cluster.local:9092,kafka-2.kafka-service.ecommerce.svc.cluster.local:9092"
  # Bootstrap schema on first deploy (application-k8s.yml sets validate which fails when tables don't exist)
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  # service-order RestClient endpoints (RestClientConfig.java uses @Value("${app.services.X.url}"))
  APP_SERVICES_PRODUCT_URL: "http://service-product:8081"
  APP_SERVICES_ORDER_URL: "http://service-order:8082"
  APP_SERVICES_PAYMENT_URL: "http://service-payment:8083"
  APP_SERVICES_CUSTOMER_URL: "http://service-customer:8084"
  # Expose /actuator/prometheus so Alloy scrapes Micrometer metrics. Each
  # service still carries its own application.yml management block; this
  # env var wins via Spring relaxed binding.
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics,circuitbreakers,circuitbreakerevents"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
