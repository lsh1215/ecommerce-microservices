spring:
  datasource:
    url: jdbc:mysql://mysql-service:3306/ecommerce_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  kafka:
    bootstrap-servers: kafka-service:9092

service:
  product:
    base-url: http://service-product:8081
  customer:
    base-url: http://service-customer:8084

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
