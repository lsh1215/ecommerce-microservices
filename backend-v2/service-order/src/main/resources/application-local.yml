spring:
  datasource:
    url: jdbc:mysql://localhost:3307/ecommerce_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: sa
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092

service:
  product:
    base-url: http://localhost:8081
  customer:
    base-url: http://localhost:8084

app:
  services:
    product:
      url: http://localhost:8081
    customer:
      url: http://localhost:8084
    payment:
      url: http://localhost:8083
  rest-client:
    connect-timeout: 5000
    read-timeout: 10000

cors:
  allowed-origins: http://localhost:3000
