server:
  port: 8082

spring:
  application:
    name: service-order
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ecommerce_order}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: service-order

service:
  product:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}

springdoc:
  info:
    title: Order Service API
    version: v1
  swagger-ui:
    path: /swagger-ui.html

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,metrics,prometheus
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Emit Prometheus histogram buckets for the outbox publish Observation timer
      # so dashboard panel 2 (outbox.publish p95/p99) can run histogram_quantile().
      # Without this only _count / _sum / _max are emitted.
      percentiles-histogram:
        outbox.publish: true

# Resilience4j Circuit Breaker (Phase 4)
# - Order 서비스의 동기 RestClient 호출(Product)에 적용.
# - 의존 서비스가 느려지거나(slow call) 실패하면 스레드 고갈을 막기 위해 회로를 OPEN.
resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10               # 최근 10건 기준 판단
        minimumNumberOfCalls: 5              # 5건 이상부터 평가
        failureRateThreshold: 50             # 실패율 50% 이상이면 OPEN
        slowCallDurationThreshold: 2s        # 2초 이상 걸리면 slow call
        slowCallRateThreshold: 50            # slow call 비율 50% 이상이면 OPEN
        waitDurationInOpenState: 10s         # OPEN 상태 10초 유지 후 HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - java.util.concurrent.TimeoutException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
