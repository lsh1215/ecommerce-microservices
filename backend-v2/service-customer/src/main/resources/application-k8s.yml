spring:
  datasource:
    url: jdbc:mysql://mysql-service:3306/ecommerce_customer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: kafka-service:9092

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
