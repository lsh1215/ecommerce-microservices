groups:
  - name: spring_boot_request_rates
    interval: 30s
    rules:
      - record: job:http_server_requests_seconds_count:rate5m
        expr: |
          sum by (job, uri, method, status) (
            rate(http_server_requests_seconds_count[5m])
          )
      - record: job:http_server_requests_seconds:p99
        expr: |
          histogram_quantile(0.99,
            sum by (job, uri, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          )
  - name: jvm_alerts
    rules:
      - alert: JvmHeapUsageCritical
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "JVM heap usage > 85%"
