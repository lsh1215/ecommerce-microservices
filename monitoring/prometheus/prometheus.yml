global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ecommerce-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
    # NOTE: Backend needs micrometer-registry-prometheus dependency
    # to expose /actuator/prometheus. Will be added in Phase 7.
