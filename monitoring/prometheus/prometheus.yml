global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'local-dev'
    env: 'development'

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Spring Boot services via Actuator
  # NOTE: Backend needs micrometer-registry-prometheus dependency (Phase 7)
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service_name: 'ecommerce-monolith'

  # cAdvisor container metrics
  - job_name: 'cadvisor'
    scrape_interval: 5s
    static_configs:
      - targets: ['cadvisor:8080']

  # OpenTelemetry Collector self-metrics
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector:8889']

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
