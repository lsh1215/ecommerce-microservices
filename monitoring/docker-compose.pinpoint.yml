services:
  pinpoint-hbase:
    image: pinpointdocker/pinpoint-hbase:3.0.1
    container_name: pinpoint-hbase
    ports:
      - "16010:16010"
      - "16030:16030"
    volumes:
      - pinpoint-hbase-data:/home/pinpoint/hbase
      - pinpoint-zk-data:/home/pinpoint/zookeeper
    restart: unless-stopped

  pinpoint-collector:
    image: pinpointdocker/pinpoint-collector:3.0.1
    container_name: pinpoint-collector
    ports:
      - "9991:9991/tcp"
      - "9992:9992/tcp"
      - "9993:9993/tcp"
      - "9994:9994/tcp"
      - "9995:9995/udp"
      - "9996:9996/udp"
    environment:
      COLLECTOR_HBASE_HOST: pinpoint-hbase
      COLLECTOR_HBASE_PORT: 2181
    depends_on:
      - pinpoint-hbase
    restart: unless-stopped

  pinpoint-web:
    image: pinpointdocker/pinpoint-web:3.0.1
    container_name: pinpoint-web
    ports:
      - "8079:8079"
    environment:
      WEB_HBASE_HOST: pinpoint-hbase
      WEB_HBASE_PORT: 2181
    depends_on:
      - pinpoint-hbase
    restart: unless-stopped

volumes:
  pinpoint-hbase-data:
  pinpoint-zk-data:
