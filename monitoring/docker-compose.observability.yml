networks:
  observability:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

services:

  # METRICS: Prometheus
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: ecommerce-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability

  # CONTAINER METRICS: cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.56.2
    container_name: ecommerce-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks:
      - observability

  # LOGS: Grafana Loki
  loki:
    image: grafana/loki:3.6.7
    container_name: ecommerce-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability

  # LOG COLLECTOR: Grafana Alloy (Promtail successor, EOL March 2026)
  alloy:
    image: grafana/alloy:v1.13.2
    container_name: ecommerce-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - "--storage.path=/var/lib/alloy/data"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    networks:
      - observability
    depends_on:
      - loki

  # TRACES: Grafana Tempo
  tempo:
    image: grafana/tempo:2.10.1
    container_name: ecommerce-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - observability

  # TELEMETRY PIPELINE: OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: ecommerce-otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yml"]
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8889:8889"
      - "13133:13133"
    networks:
      - observability
    depends_on:
      - tempo
      - loki
      - prometheus

  # VISUALIZATION: Grafana
  grafana:
    image: grafana/grafana:12.4.0
    container_name: ecommerce-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor traceToMetrics
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
